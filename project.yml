name: SkimHN
options:
  bundleIdPrefix: com.aloi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.aloi.SkimHN
    # iOS 26 recommended settings — applied via Xcode's
    # "Update to Recommended Settings" prompt and mirrored here so they
    # survive `xcodegen generate`.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  SkimHN:
    type: application
    platform: iOS
    sources:
      - path: SkimHN
    dependencies:
      - target: SkimHNShareExtension
    # Manual Info.plist. We used to lean on GENERATE_INFOPLIST_FILE +
    # INFOPLIST_KEY_ settings, but the Xcode 17 / iOS 26 SDK doesn't
    # recognize INFOPLIST_KEY_UIBackgroundModes or
    # INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers — they
    # silently drop on the floor at build time. Writing the plist
    # ourselves is the only reliable way to ship the background-task
    # identifier the Mentions feature needs.
    info:
      path: SkimHN/Info.plist
      properties:
        CFBundleDisplayName: SkimHN
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchScreen:
          UIColorName: systemBackground
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.aloi.SkimHN.refresh-mentions
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false
      commandLineArguments: {}
      environmentVariables: []

  SkimHNShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SkimHNShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aloi.SkimHN.ShareExtension
        PRODUCT_NAME: SkimHNShareExtension
        # App extensions need a NESTED `NSExtension` dictionary in
        # their Info.plist (with NSExtensionPointIdentifier etc.
        # nested under it). Xcode's INFOPLIST_KEY_NSExtension* build
        # settings only generate top-level keys, which the installer
        # rejects at install time. So we ship a manual Info.plist
        # rather than letting GENERATE_INFOPLIST_FILE produce one.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SkimHNShareExtension/Info.plist

schemes:
  SkimHN:
    build:
      targets:
        SkimHN: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
