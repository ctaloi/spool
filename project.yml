name: SkimHN
options:
  bundleIdPrefix: com.aloi
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.aloi.SkimHN
    INFOPLIST_KEY_CFBundleDisplayName: "SkimHN"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_BackgroundColor: systemBackground
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    # iOS 26 recommended settings — applied via Xcode's
    # "Update to Recommended Settings" prompt and mirrored here so they
    # survive `xcodegen generate`.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  SkimHN:
    type: application
    platform: iOS
    sources:
      - path: SkimHN
    dependencies:
      - target: SkimHNShareExtension
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false
      commandLineArguments: {}
      environmentVariables: []

  SkimHNShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SkimHNShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aloi.SkimHN.ShareExtension
        PRODUCT_NAME: SkimHNShareExtension
        GENERATE_INFOPLIST_FILE: YES
        # Show "SkimHN" in the share sheet, not the internal target name.
        INFOPLIST_KEY_CFBundleDisplayName: "SkimHN"
        INFOPLIST_KEY_NSExtensionPointIdentifier: com.apple.share-services
        INFOPLIST_KEY_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
        # Only show SkimHN in the share sheet for URLs / web pages —
        # not for images, files, or arbitrary text. `TRUEPREDICATE`
        # would match everything, which annoys users.
        INFOPLIST_KEY_NSExtensionActivationRule: SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $att, ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" OR ANY $att.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text").@count >= 1).@count == 1

schemes:
  SkimHN:
    build:
      targets:
        SkimHN: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
