name: Spool
options:
  bundleIdPrefix: news.getspool
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# Project-level base xcconfig — DEVELOPMENT_TEAM lives here so it
# survives every `xcodegen generate`. See Configs/Signing.xcconfig
# for the one-time setup notes.
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    PRODUCT_BUNDLE_IDENTIFIER: news.getspool.app
    # iOS 26 recommended settings — applied via Xcode's
    # "Update to Recommended Settings" prompt and mirrored here so they
    # survive `xcodegen generate`.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  Spool:
    type: application
    platform: iOS
    sources:
      - path: Spool
    dependencies:
      - target: SpoolShareExtension
      - target: SpoolWidget
    # Manual Info.plist. We used to lean on GENERATE_INFOPLIST_FILE +
    # INFOPLIST_KEY_ settings, but the Xcode 17 / iOS 26 SDK doesn't
    # recognize INFOPLIST_KEY_UIBackgroundModes or
    # INFOPLIST_KEY_BGTaskSchedulerPermittedIdentifiers — they
    # silently drop on the floor at build time. Writing the plist
    # ourselves is the only reliable way to ship the background-task
    # identifier the Mentions feature needs.
    info:
      path: Spool/Info.plist
      properties:
        CFBundleDisplayName: Spool
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Spool uses only Apple's standard HTTPS / TLS — no custom
        # crypto. Declaring this here means App Store Connect never
        # prompts the export-compliance question on each upload.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - news.getspool.app.refresh-mentions
        CFBundleURLTypes:
          - CFBundleURLName: news.getspool.app
            CFBundleURLSchemes:
              - spool
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false
      commandLineArguments: {}
      environmentVariables: []

  SpoolShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SpoolShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: news.getspool.app.share
        PRODUCT_NAME: SpoolShareExtension
        # App extensions need a NESTED `NSExtension` dictionary in
        # their Info.plist (with NSExtensionPointIdentifier etc.
        # nested under it). Xcode's INFOPLIST_KEY_NSExtension* build
        # settings only generate top-level keys, which the installer
        # rejects at install time. So we ship a manual Info.plist
        # rather than letting GENERATE_INFOPLIST_FILE produce one.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SpoolShareExtension/Info.plist

  SpoolWidget:
    type: app-extension
    platform: iOS
    # Widget views need: WidgetKit's own files, plus the HN API +
    # HNItem model from the main app. Each shared file gets compiled
    # into both targets — that's fine because HNAPI is an actor with
    # no static state and HNItem is a stateless value type.
    sources:
      - path: SpoolWidget
      - path: Spool/Networking/HNAPI.swift
      - path: Spool/Models/HNItem.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: news.getspool.app.widget
        PRODUCT_NAME: SpoolWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SpoolWidget/Info.plist
        # WidgetKit / SwiftUI link automatically via Swift's import
        # mechanism. No extra LD_RUNPATH_SEARCH_PATHS needed beyond
        # the @executable_path default.

  SpoolTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpoolTests
    dependencies:
      - target: Spool
    settings:
      base:
        # Swift Testing (the modern replacement for XCTest) is built
        # into the iOS 26 SDK; no separate package needed.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: news.getspool.app.tests
    # Auto-generate a scheme for the test target. xcodegen wires
    # this into the host app's scheme too via the `test` action's
    # targets list below.
    scheme:
      testTargets:
        - SpoolTests
      gatherCoverageData: true

  SpoolUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpoolUITests
    dependencies:
      - target: Spool
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: news.getspool.app.uitests
        TEST_TARGET_NAME: Spool
    scheme:
      testTargets:
        - SpoolUITests
      gatherCoverageData: false

schemes:
  Spool:
    build:
      targets:
        Spool: all
        SpoolTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SpoolTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
